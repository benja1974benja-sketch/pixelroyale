<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PixelRoyale</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0a0a0f;display:flex;justify-content:center;align-items:center;min-height:100vh;font-family:'Segoe UI',system-ui,sans-serif;color:white;overflow:hidden}
#game-container{position:relative;box-shadow:0 0 40px rgba(0,200,255,.3);border-radius:8px;overflow:hidden}
canvas{display:block;background:#1a1a2e}
#ui{position:absolute;top:0;left:0;width:100%;height:100%;pointer-events:none}
#hud{position:absolute;top:12px;left:12px;display:flex;flex-direction:column;gap:6px}
.hud-box{background:rgba(0,0,0,.7);padding:7px 12px;border-radius:6px;font-size:13px;border:1px solid rgba(255,255,255,.12)}
#health-bar-container,#shield-bar-container{width:170px;height:14px;background:rgba(0,0,0,.6);border-radius:3px;border:1px solid rgba(255,255,255,.2);overflow:hidden;margin-bottom:2px}
#health-bar{height:100%;width:100%;background:linear-gradient(90deg,#e74c3c,#f39c12);transition:width .15s}
#shield-bar{height:100%;width:0%;background:linear-gradient(90deg,#3498db,#00c6ff);transition:width .15s}
#player-list{position:absolute;top:12px;right:12px;background:rgba(0,0,0,.7);padding:10px 14px;border-radius:8px;font-size:12px;min-width:140px;border:1px solid rgba(255,255,255,.12)}
#player-list h3{font-size:12px;color:#00c6ff;margin-bottom:6px}
.plist-item{padding:2px 0}
.plist-item.me{color:#2ecc71;font-weight:600}
.plist-item.dead{color:#888;text-decoration:line-through}
#chat-box{position:absolute;bottom:110px;left:12px;width:260px;max-height:100px;overflow-y:auto;font-size:12px;pointer-events:none}
.chat-msg{background:rgba(0,0,0,.55);padding:3px 8px;margin-bottom:2px;border-radius:4px}
#chat-input-container{position:absolute;bottom:70px;left:12px;display:none;pointer-events:all}
#chat-input{background:rgba(0,0,0,.8);border:1px solid #00c6ff;color:white;padding:8px 12px;border-radius:6px;width:260px;font-size:13px;outline:none}
#status{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);background:rgba(0,0,0,.85);padding:20px 40px;border-radius:12px;text-align:center;z-index:20;pointer-events:all}
#status button{background:linear-gradient(135deg,#00c6ff,#0072ff);border:none;color:white;padding:12px 28px;font-size:16px;border-radius:8px;cursor:pointer;margin-top:12px;font-weight:600}
#status input{background:rgba(255,255,255,.1);border:1px solid #555;color:white;padding:8px 12px;border-radius:6px;width:200px;margin:8px 0;font-size:14px}
#hotbar{position:absolute;bottom:14px;left:50%;transform:translateX(-50%);display:flex;gap:6px;pointer-events:all}
.slot{width:54px;height:54px;background:rgba(0,0,0,.75);border:2px solid rgba(255,255,255,.2);border-radius:8px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:22px;position:relative;cursor:pointer;transition:border-color .15s,transform .1s}
.slot.active{border-color:#00c6ff;box-shadow:0 0 12px rgba(0,198,255,.4);transform:scale(1.08)}
.slot .key{position:absolute;top:2px;left:4px;font-size:10px;color:#aaa}
#build-indicator{position:absolute;bottom:80px;left:50%;transform:translateX(-50%);background:rgba(0,0,0,.75);padding:7px 14px;border-radius:20px;font-size:12px;opacity:0;transition:opacity .25s}
#build-indicator.active{opacity:1}
#connection-status{position:absolute;bottom:14px;right:14px;font-size:11px;color:#888;background:rgba(0,0,0,.5);padding:4px 10px;border-radius:10px}
#connection-status.connected{color:#2ecc71}
#connection-status.disconnected{color:#e74c3c}
#emote-bar{position:absolute;bottom:14px;left:14px;display:flex;gap:5px}
.emote-btn{background:rgba(0,0,0,.7);border:1px solid rgba(255,255,255,.2);color:white;width:36px;height:36px;border-radius:8px;font-size:16px;display:flex;align-items:center;justify-content:center;pointer-events:all;cursor:pointer}
.emote-btn:hover{background:rgba(0,150,255,.4)}
</style>
</head>
<body>
<div id="game-container">
<canvas id="game" width="900" height="600"></canvas>
<div id="ui">
<div id="hud">
<div class="hud-box">
<div style="font-size:10px;color:#aaa;margin-bottom:1px">VIDA</div>
<div id="health-bar-container"><div id="health-bar"></div></div>
<div style="font-size:10px;color:#5dade2;margin-bottom:1px">ESCUDO</div>
<div id="shield-bar-container"><div id="shield-bar"></div></div>
</div>
<div class="hud-box" id="materials">🪵 Materiales: 30</div>
<div class="hud-box" id="kills">💀 Eliminaciones: 0</div>
</div>
<div id="player-list"><h3>Jugadores</h3><div id="plist-content"></div></div>
<div id="chat-box"></div>
<div id="chat-input-container"><input id="chat-input" type="text" placeholder="Escribe un mensaje..." maxlength="100"></div>
<div id="build-indicator">Modo Construcción (Q) · 10 materiales</div>
<div id="hotbar">
<div class="slot" id="slot1" onclick="setSlot(1)"><span class="key">1</span>⛏️</div>
<div class="slot active" id="slot2" onclick="setSlot(2)"><span class="key">2</span>🔫</div>
</div>
<div id="emote-bar">
<div class="emote-btn" onclick="doEmote('dance')">💃</div>
<div class="emote-btn" onclick="doEmote('wave')">👋</div>
<div class="emote-btn" onclick="doEmote('cheer')">🎉</div>
<div class="emote-btn" onclick="doEmote('sit')">🪑</div>
</div>
<div id="connection-status" class="disconnected">Desconectado</div>
</div>
<div id="status">
<h2 style="margin-bottom:8px">PixelRoyale</h2>
<p style="color:#aaa;font-size:13px;margin-bottom:10px">Multijugador · Construye · Tala · Dispara</p>
<input id="name-input" type="text" placeholder="Tu nombre" maxlength="16">
<br>
<button onclick="connect()">Conectar</button>
<p style="color:#666;font-size:11px;margin-top:12px">
WASD mover · 1 Pico · 2 Arma · Q construir<br>
Ratón atacar · 3-6 emotes · Enter chat
</p>
</div>
</div>
<script>
const canvas=document.getElementById('game');
const ctx=canvas.getContext('2d');
const W=canvas.width,H=canvas.height,WORLD=2000;
let ws=null,myId=null,gameRunning=false;
let players=new Map(),walls=[],trees=[],me=null;
let bullets=[],particles=[];
let keys={},mouse={x:W/2,y:H/2,down:false};
let camX=0,camY=0,lastShot=0,lastUpdate=0,lastSwing=0;
let myKills=0,buildMode=false,currentSlot=2;

function rand(a,b){return Math.random()*(b-a)+a}
function dist(a,b){return Math.hypot(a.x-b.x,a.y-b.y)}

function connect(){
const name=document.getElementById('name-input').value.trim()||'Jugador';
const protocol=location.protocol==='https:'?'wss:':'ws:';
const host=location.host||'localhost:3000';
ws=new WebSocket(protocol+'//'+host);
ws.onopen=()=>{
document.getElementById('connection-status').textContent='Conectado';
document.getElementById('connection-status').className='connected';
document.getElementById('status').style.display='none';
ws.send(JSON.stringify({type:'setName',name}));
};
ws.onclose=()=>{
document.getElementById('connection-status').textContent='Desconectado';
document.getElementById('connection-status').className='disconnected';
gameRunning=false;
document.getElementById('status').style.display='block';
document.getElementById('status').innerHTML='<h2>Desconectado</h2><p style="color:#aaa;margin:10px 0">Se perdió la conexión</p><button onclick="location.reload()">Reintentar</button>';
};
ws.onerror=()=>alert('No se pudo conectar al servidor');
ws.onmessage=e=>handleMessage(JSON.parse(e.data));
}

function handleMessage(data){
switch(data.type){
case 'welcome':
myId=data.id;
me={id:myId,x:0,y:0,angle:0,health:100,shield:0,materials:30,color:'#00c6ff',name:'Yo',emote:null,alive:true,facing:1,walkCycle:0,slot:2};
players.clear();
walls=data.walls||[];
trees=data.trees||[];
for(const p of data.players){
if(p.id===myId){me.x=p.x;me.y=p.y;me.color=p.color;me.health=p.health;me.shield=p.shield;me.materials=p.materials||30}
else players.set(p.id,Object.assign({},p,{facing:1,walkCycle:0}));
}
gameRunning=true;updateHUD();updatePlayerList();requestAnimationFrame(loop);
break;
case 'playerJoined':
if(data.player.id!==myId){players.set(data.player.id,Object.assign({},data.player,{facing:1,walkCycle:0}));addChat('Sistema',data.player.name+' entró');updatePlayerList()}
break;
case 'playerLeft':
players.delete(data.id);addChat('Sistema','Jugador salió');updatePlayerList();
break;
case 'playerUpdate':
if(data.id!==myId&&players.has(data.id)){
const p=players.get(data.id);
p.x=data.x;p.y=data.y;p.angle=data.angle;p.emote=data.emote;
p.health=data.health;p.shield=data.shield;p.slot=data.slot||2;
if(data.materials!==undefined)p.materials=data.materials;
p.walkCycle+=.2;
}
break;
case 'shoot':
if(data.id!==myId)bullets.push({x:data.x,y:data.y,vx:Math.cos(data.angle)*11,vy:Math.sin(data.angle)*11,radius:4,damage:20,fromId:data.id,life:70});
break;
case 'playerDamaged':
if(data.id===myId){me.health=data.health;me.shield=data.shield;createParticles(me.x,me.y,'#e74c3c',6);updateHUD()}
else if(players.has(data.id)){const p=players.get(data.id);p.health=data.health;p.shield=data.shield}
break;
case 'playerDied':
if(data.id===myId){me.alive=false;me.health=0;updateHUD();setTimeout(()=>alert('¡Has sido eliminado!'),100)}
else if(players.has(data.id)){
const p=players.get(data.id);p.alive=false;p.health=0;
createParticles(p.x,p.y,p.color,16);
if(data.killerId===myId){myKills++;me.materials+=15;updateHUD()}
}
updatePlayerList();
break;
case 'wallBuilt':
walls.push(data.wall);
if(data.playerId===myId){me.materials=data.materials;updateHUD()}
createParticles(data.wall.x+20,data.wall.y+20,'#00c6ff',8);
break;
case 'wallDamaged':{const wd=walls.find(w=>w.id===data.wallId);if(wd)wd.health=data.health}break;
case 'wallDestroyed':{
const idx=walls.findIndex(w=>w.id===data.wallId);
if(idx!==-1){const w=walls[idx];createParticles(w.x+w.w/2,w.y+w.h/2,'#888',14);walls.splice(idx,1)}
}break;
case 'treeDamaged':{
const t=trees.find(t=>t.id===data.treeId);
if(t){t.health=data.health;createParticles(t.x,t.y,'#8B4513',4)}
}break;
case 'treeDestroyed':{
const idx=trees.findIndex(t=>t.id===data.treeId);
if(idx!==-1){const t=trees[idx];createParticles(t.x,t.y,'#228B22',12);trees.splice(idx,1)}
if(data.playerId===myId){me.materials=data.materials;updateHUD()}
}break;
case 'nameChange':
if(players.has(data.id)){players.get(data.id).name=data.name;updatePlayerList()}
break;
case 'chat':addChat(data.name,data.message);break;
}
}

function send(data){if(ws&&ws.readyState===WebSocket.OPEN)ws.send(JSON.stringify(data))}

function setSlot(n){
currentSlot=n;
if(me)me.slot=n;
document.getElementById('slot1').classList.toggle('active',n===1);
document.getElementById('slot2').classList.toggle('active',n===2);
buildMode=false;updateHUD();
}

function updateHUD(){
if(!me)return;
document.getElementById('health-bar').style.width=Math.max(0,me.health)+'%';
document.getElementById('shield-bar').style.width=Math.max(0,me.shield)+'%';
document.getElementById('materials').textContent='🪵 Materiales: '+me.materials;
document.getElementById('kills').textContent='💀 Eliminaciones: '+myKills;
document.getElementById('build-indicator').classList.toggle('active',buildMode);
}

function updatePlayerList(){
const el=document.getElementById('plist-content');
let html='<div class="plist-item me">'+(me?me.name:'Yo')+' (tú)</div>';
for(const p of players.values())html+='<div class="plist-item'+(p.alive?'':' dead')+'">'+p.name+'</div>';
el.innerHTML=html;
}

function addChat(name,msg){
const box=document.getElementById('chat-box');
const div=document.createElement('div');
div.className='chat-msg';
div.innerHTML='<b style="color:#00c6ff">'+name+':</b> '+msg;
box.appendChild(div);box.scrollTop=box.scrollHeight;
if(box.children.length>8)box.removeChild(box.firstChild);
}

function createParticles(x,y,color,count){
count=count||8;
for(let i=0;i<count;i++)particles.push({x:x,y:y,vx:rand(-3,3),vy:rand(-3,3),life:rand(15,35),maxLife:35,color:color,size:rand(2,4)});
}

function doEmote(type){
if(!me||!me.alive)return;
me.emote=type;
setTimeout(()=>{if(me.emote===type)me.emote=null},type==='sit'?99999:2000);
}

function buildWall(){
if(!me||!me.alive||me.materials<10)return;
const bx=me.x+Math.cos(me.angle)*55-20;
const by=me.y+Math.sin(me.angle)*55-20;
send({type:'build',x:bx,y:by});
}

function swingPickaxe(){
if(!me||!me.alive||currentSlot!==1||Date.now()-lastSwing<350)return;
lastSwing=Date.now();
// Buscar árbol cercano en dirección del mouse
let closest=null,closestD=50;
for(const t of trees){
const d=dist(me,t);
if(d<closestD){closestD=d;closest=t}
}
if(closest){
send({type:'treeHit',treeId:closest.id});
createParticles(closest.x,closest.y,'#8B4513',6);
}
// También puede dañar paredes
for(const w of walls){
const cx=w.x+w.w/2,cy=w.y+w.h/2;
if(dist(me,{x:cx,y:cy})<55){
send({type:'wallHit',wallId:w.id,damage:30});
createParticles(cx,cy,'#aaa',5);
break;
}
}
}

function drawTree(t){
ctx.save();
ctx.translate(t.x,t.y);
// Tronco
ctx.fillStyle='#5D4037';
ctx.fillRect(-6,-5,12,22);
// Copa
const hp=t.health/t.maxHealth;
ctx.beginPath();
ctx.arc(0,-18,16*hp+4,0,Math.PI*2);
ctx.fillStyle=`rgba(34,${Math.floor(100+hp*50)},34,0.9)`;
ctx.fill();
ctx.beginPath();
ctx.arc(-8,-12,10*hp+2,0,Math.PI*2);
ctx.arc(8,-12,10*hp+2,0,Math.PI*2);
ctx.fill();
// Barra de vida si dañado
if(t.health<t.maxHealth){
ctx.fillStyle='#333';
ctx.fillRect(-14,-40,28,4);
ctx.fillStyle='#2ecc71';
ctx.fillRect(-14,-40,28*(t.health/t.maxHealth),4);
}
ctx.restore();
}

function drawPerson(x,y,angle,color,walkCycle,emote,name,isMe,slot){
ctx.save();
ctx.translate(x,y);
let armL=-.4,armR=.4,legL=0,legR=0,bob=0,sit=0;
if(emote==='dance'){const t=Date.now()/120;armL=Math.sin(t)*1.1;armR=-Math.sin(t)*1.1;legL=Math.sin(t)*.4;legR=-legL;bob=Math.sin(t*2)*2.5}
else if(emote==='wave'){armR=-1.7+Math.sin(Date.now()/100)*.4}
else if(emote==='cheer'){armL=armR=-2.1;bob=Math.abs(Math.sin(Date.now()/140))*3}
else if(emote==='sit'){sit=7;legL=legR=1.3}
else{const w=Math.sin(walkCycle)*.55;legL=w;legR=-w;armL=-w*.6;armR=w*.6}
ctx.translate(0,bob);
ctx.beginPath();ctx.ellipse(0,13,9,3.5,0,0,Math.PI*2);ctx.fillStyle='rgba(0,0,0,.25)';ctx.fill();
ctx.strokeStyle='#2c3e50';ctx.lineWidth=3.5;ctx.lineCap='round';
ctx.beginPath();ctx.moveTo(-3.5,2+sit);ctx.lineTo(-3.5+Math.sin(legL)*10,2+sit+Math.cos(legL)*10);ctx.stroke();
ctx.beginPath();ctx.moveTo(3.5,2+sit);ctx.lineTo(3.5+Math.sin(legR)*10,2+sit+Math.cos(legR)*10);ctx.stroke();
ctx.fillStyle=color;ctx.beginPath();ctx.roundRect(-7,-14+sit,14,15,3);ctx.fill();
ctx.strokeStyle=color;ctx.lineWidth=3;
ctx.beginPath();ctx.moveTo(-6,-8+sit);ctx.lineTo(-6+Math.sin(armL)*9,-8+sit+Math.cos(armL)*9);ctx.stroke();
ctx.beginPath();ctx.moveTo(6,-8+sit);ctx.lineTo(6+Math.sin(armR)*9,-8+sit+Math.cos(armR)*9);ctx.stroke();
ctx.beginPath();ctx.arc(0,-18+sit,6.5,0,Math.PI*2);ctx.fillStyle='#f5d0a9';ctx.fill();
ctx.fillStyle='#222';ctx.beginPath();ctx.arc(-2.2,-19+sit,1.3,0,Math.PI*2);ctx.arc(2.2,-19+sit,1.3,0,Math.PI*2);ctx.fill();
// Arma o pico según slot
if(!emote||emote==='sit'){
ctx.save();ctx.translate(0,-5+sit);ctx.rotate(angle);
if(slot===1){
// Pico
ctx.fillStyle='#888';ctx.fillRect(7,-1.5,12,3);
ctx.fillStyle='#c0c0c0';ctx.beginPath();ctx.moveTo(19,-6);ctx.lineTo(26,0);ctx.lineTo(19,6);ctx.closePath();ctx.fill();
}else{
// Arma
ctx.fillStyle='#444';ctx.fillRect(7,-1.5,14,3);
}
ctx.restore();
}
ctx.font='bold 11px sans-serif';ctx.textAlign='center';
ctx.fillStyle=isMe?'#2ecc71':'#fff';
ctx.fillText(name||'',0,-30+sit);
ctx.restore();
}

function loop(){
if(!gameRunning||!me)return;
if(me.alive){
const dx=((keys['d']||keys['D'])?1:0)-((keys['a']||keys['A'])?1:0);
const dy=((keys['s']||keys['S'])?1:0)-((keys['w']||keys['W'])?1:0);
if(dx||dy){const len=Math.hypot(dx,dy)||1;me.x+=(dx/len)*3.4;me.y+=(dy/len)*3.4;me.walkCycle+=.25;if(me.emote==='sit')me.emote=null}
me.x=Math.max(20,Math.min(WORLD-20,me.x));
me.y=Math.max(20,Math.min(WORLD-20,me.y));
me.angle=Math.atan2((mouse.y+camY)-me.y,(mouse.x+camX)-me.x);

if(mouse.down){
if(currentSlot===2&&!buildMode&&!me.emote&&Date.now()-lastShot>200){
lastShot=Date.now();
const bx=me.x+Math.cos(me.angle)*20;
const by=me.y+Math.sin(me.angle)*20;
bullets.push({x:bx,y:by,vx:Math.cos(me.angle)*12,vy:Math.sin(me.angle)*12,radius:4,damage:20,fromId:myId,life:70});
send({type:'shoot',x:bx,y:by,angle:me.angle});
}else if(currentSlot===1){
swingPickaxe();
}
}
}
if(Date.now()-lastUpdate>50){
lastUpdate=Date.now();
send({type:'update',x:me.x,y:me.y,angle:me.angle,emote:me.emote,slot:currentSlot});
}

// Balas
for(let i=bullets.length-1;i>=0;i--){
const b=bullets[i];b.x+=b.vx;b.y+=b.vy;b.life--;
for(const w of walls){
if(b.x>w.x&&b.x<w.x+w.w&&b.y>w.y&&b.y<w.y+w.h){
if(b.fromId===myId)send({type:'wallHit',wallId:w.id,damage:22});
createParticles(b.x,b.y,'#aaa',5);b.life=0;break;
}
}
if(b.life>0&&b.fromId===myId){
for(const[pid,p]of players){
if(p.alive&&dist(b,p)<18){send({type:'hit',targetId:pid,damage:22});createParticles(b.x,b.y,'#fff',6);b.life=0;break}
}
}
if(b.life>0&&b.fromId!==myId&&me.alive&&dist(b,me)<16){createParticles(b.x,b.y,'#e74c3c',5);b.life=0}
if(b.life<=0)bullets.splice(i,1);
}

for(let i=particles.length-1;i>=0;i--){
const p=particles[i];p.x+=p.vx;p.y+=p.vy;p.vx*=.94;p.vy*=.94;p.life--;
if(p.life<=0)particles.splice(i,1);
}

camX=Math.max(0,Math.min(WORLD-W,me.x-W/2));
camY=Math.max(0,Math.min(WORLD-H,me.y-H/2));

ctx.clearRect(0,0,W,H);
ctx.save();ctx.translate(-camX,-camY);
ctx.fillStyle='#16213e';ctx.fillRect(0,0,WORLD,WORLD);
ctx.strokeStyle='rgba(255,255,255,.03)';ctx.lineWidth=1;
for(let x=0;x<WORLD;x+=60){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,WORLD);ctx.stroke()}
for(let y=0;y<WORLD;y+=60){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(WORLD,y);ctx.stroke()}

// Árboles
for(const t of trees)drawTree(t);

// Paredes
for(const w of walls){
const alpha=Math.max(.35,w.health/120);
ctx.fillStyle=`rgba(100,110,140,${alpha})`;
ctx.fillRect(w.x,w.y,w.w,w.h);
ctx.strokeStyle=`rgba(160,170,200,${alpha})`;
ctx.lineWidth=2;ctx.strokeRect(w.x,w.y,w.w,w.h);
}

// Balas
for(const b of bullets){
ctx.beginPath();ctx.arc(b.x,b.y,b.radius,0,Math.PI*2);
ctx.fillStyle=b.fromId===myId?'#00e5ff':'#ff5252';ctx.fill();
}

// Jugadores
for(const p of players.values()){
if(p.alive)drawPerson(p.x,p.y,p.angle,p.color,p.walkCycle,p.emote,p.name,false,p.slot||2);
}
if(me.alive)drawPerson(me.x,me.y,me.angle,me.color,me.walkCycle,me.emote,me.name,true,currentSlot);

// Preview construcción
if(buildMode&&me.alive&&me.materials>=10){
const bx=me.x+Math.cos(me.angle)*55-20;
const by=me.y+Math.sin(me.angle)*55-20;
ctx.fillStyle='rgba(0,200,255,.3)';ctx.fillRect(bx,by,40,40);
ctx.strokeStyle='rgba(0,200,255,.85)';ctx.lineWidth=2;ctx.strokeRect(bx,by,40,40);
}

for(const p of particles){
ctx.globalAlpha=p.life/p.maxLife;
ctx.beginPath();ctx.arc(p.x,p.y,p.size,0,Math.PI*2);
ctx.fillStyle=p.color;ctx.fill();
}
ctx.globalAlpha=1;ctx.restore();
requestAnimationFrame(loop);
}

window.addEventListener('keydown',e=>{
keys[e.key]=true;
if(e.key==='1')setSlot(1);
if(e.key==='2')setSlot(2);
if(e.key==='q'||e.key==='Q'){buildMode=!buildMode;updateHUD()}
if((e.key===' '||e.code==='Space')&&buildMode){e.preventDefault();buildWall()}
if(e.key==='Enter'){
const c=document.getElementById('chat-input-container');
const input=document.getElementById('chat-input');
if(c.style.display==='block'){if(input.value.trim())send({type:'chat',message:input.value.trim()});input.value='';c.style.display='none'}
else{c.style.display='block';input.focus()}
}
if(e.key==='3')doEmote('dance');
if(e.key==='4')doEmote('wave');
if(e.key==='5')doEmote('cheer');
if(e.key==='6')doEmote('sit');
if(e.key==='Escape'){buildMode=false;updateHUD()}
});
window.addEventListener('keyup',e=>keys[e.key]=false);
canvas.addEventListener('mousemove',e=>{const r=canvas.getBoundingClientRect();mouse.x=e.clientX-r.left;mouse.y=e.clientY-r.top});
canvas.addEventListener('mousedown',()=>{if(buildMode)buildWall();else mouse.down=true});
canvas.addEventListener('mouseup',()=>mouse.down=false);
canvas.addEventListener('contextmenu',e=>e.preventDefault());
</script>
</body>
</html>
