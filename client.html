<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Pixel Royale 2.0</title>

<style>
*{
  box-sizing:border-box;
  user-select:none;
  -webkit-user-select:none;
  -webkit-touch-callout:none;
}

html,body{
  margin:0;
  padding:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:#10131a;
  font-family:Arial,Helvetica,sans-serif;
  color:white;
}

body{
  touch-action:none;
}

.hidden{
  display:none!important;
}

#game{
  position:fixed;
  inset:0;
  width:100vw;
  height:100vh;
  background:#18202a;
}

canvas{
  display:block;
  width:100%;
  height:100%;
  image-rendering:pixelated;
  image-rendering:crisp-edges;
}

/* =========================
   HUD
========================= */

#hud{
  position:fixed;
  top:12px;
  left:12px;
  z-index:20;
  min-width:220px;
  pointer-events:none;
}

#playerCard{
  background:rgba(10,14,20,.88);
  border:2px solid #394454;
  border-radius:10px;
  padding:9px 12px;
  box-shadow:0 5px 20px rgba(0,0,0,.3);
}

#playerName{
  font-size:16px;
  font-weight:bold;
  margin-bottom:6px;
}

.bar{
  width:190px;
  height:12px;
  background:#252b34;
  border:1px solid #111;
  border-radius:5px;
  overflow:hidden;
  margin-top:4px;
}

#hpBar{
  width:100%;
  height:100%;
  background:#36d66b;
}

#shieldBar{
  width:100%;
  height:100%;
  background:#36a9ff;
}

#stats{
  font-size:12px;
  color:#d5dbe5;
  margin-top:7px;
}

#topCenter{
  position:fixed;
  top:12px;
  left:50%;
  transform:translateX(-50%);
  z-index:20;
  pointer-events:none;
  text-align:center;
}

#aliveCount{
  background:rgba(10,14,20,.85);
  border:2px solid #394454;
  border-radius:10px;
  padding:7px 14px;
  font-size:14px;
  font-weight:bold;
}

#playerList{
  position:fixed;
  top:12px;
  right:12px;
  z-index:20;
  width:190px;
  background:rgba(10,14,20,.86);
  border:2px solid #394454;
  border-radius:10px;
  padding:8px;
  pointer-events:none;
}

#playerListTitle{
  font-weight:bold;
  font-size:13px;
  margin-bottom:6px;
}

.playerRow{
  font-size:12px;
  padding:3px 4px;
  border-radius:4px;
  margin-bottom:2px;
}

.playerRow.me{
  background:rgba(70,130,255,.2);
}

/* =========================
   CHAT
========================= */

#chat{
  position:fixed;
  left:12px;
  bottom:105px;
  z-index:30;
  width:300px;
  pointer-events:none;
}

.chatMessage{
  background:rgba(8,10,14,.72);
  border-radius:5px;
  padding:4px 7px;
  margin-top:3px;
  font-size:12px;
  text-shadow:1px 1px #000;
}

#chatInputBox{
  position:fixed;
  left:12px;
  bottom:65px;
  z-index:40;
  display:flex;
  gap:5px;
}

#chatInput{
  width:230px;
  padding:8px;
  border:2px solid #394454;
  border-radius:7px;
  background:#111720;
  color:#fff;
  outline:none;
}

#chatSend{
  border:0;
  border-radius:7px;
  padding:8px 12px;
  background:#3d7cff;
  color:white;
  font-weight:bold;
}

/* =========================
   HOTBAR
========================= */

#hotbar{
  position:fixed;
  left:50%;
  bottom:15px;
  transform:translateX(-50%);
  z-index:25;
  display:flex;
  gap:7px;
  pointer-events:auto;
}

.slot{
  width:62px;
  height:62px;
  border:2px solid #4b5666;
  background:rgba(16,21,29,.9);
  border-radius:9px;
  display:flex;
  align-items:center;
  justify-content:center;
  flex-direction:column;
  position:relative;
  color:white;
}

.slot.active{
  border-color:#ffd84d;
  box-shadow:0 0 10px rgba(255,216,77,.35);
}

.slotKey{
  position:absolute;
  top:3px;
  left:5px;
  font-size:10px;
  color:#bfc8d5;
}

.slotIcon{
  font-size:24px;
}

.slotName{
  font-size:9px;
  color:#cbd2dc;
}

#ammo{
  position:fixed;
  right:20px;
  bottom:22px;
  z-index:25;
  background:rgba(10,14,20,.9);
  border:2px solid #394454;
  border-radius:8px;
  padding:9px 13px;
  font-weight:bold;
}

/* =========================
   ACTION / EMOTES
========================= */

#actionButton{
  position:fixed;
  right:20px;
  bottom:110px;
  z-index:30;
  border:2px solid #596577;
  background:rgba(15,20,28,.9);
  color:#fff;
  padding:10px 14px;
  border-radius:8px;
  font-weight:bold;
}

#emotes{
  position:fixed;
  right:20px;
  bottom:160px;
  z-index:30;
  display:flex;
  gap:5px;
}

.emote{
  border:2px solid #485364;
  background:rgba(12,16,23,.9);
  border-radius:7px;
  padding:7px;
  font-size:18px;
}

/* =========================
   CONNECTION
========================= */

#connection{
  position:fixed;
  top:8px;
  left:50%;
  transform:translateX(-50%);
  z-index:100;
  font-size:11px;
  padding:4px 8px;
  border-radius:5px;
  background:#d93636;
  display:none;
}

#connection.ok{
  background:#249a50;
}

/* =========================
   LOBBY
========================= */

#lobby{
  position:fixed;
  inset:0;
  z-index:100;
  background:
    radial-gradient(circle at 50% 30%,#273c5c 0,#172335 35%,#0c1119 100%);
  display:flex;
  align-items:center;
  justify-content:center;
  padding:20px;
}

#lobbyPanel{
  width:min(560px,95vw);
  max-height:92vh;
  overflow:auto;
  background:rgba(10,14,21,.94);
  border:2px solid #4a5668;
  border-radius:15px;
  padding:25px;
  box-shadow:0 15px 60px rgba(0,0,0,.55);
}

#logo{
  text-align:center;
  font-size:34px;
  font-weight:900;
  letter-spacing:2px;
  color:#ffd84d;
  text-shadow:4px 4px #10131a;
  margin-bottom:4px;
}

#subtitle{
  text-align:center;
  color:#9ca8b9;
  margin-bottom:22px;
}

.input{
  width:100%;
  padding:12px;
  margin-bottom:10px;
  background:#151c26;
  border:2px solid #3b4656;
  border-radius:8px;
  color:#fff;
  outline:none;
}

.select{
  width:100%;
  padding:11px;
  margin-bottom:10px;
  background:#151c26;
  border:2px solid #3b4656;
  border-radius:8px;
  color:#fff;
}

.button{
  width:100%;
  border:0;
  padding:12px;
  border-radius:8px;
  color:#fff;
  font-weight:bold;
  cursor:pointer;
  margin-top:6px;
}

.primary{
  background:#3d7cff;
}

.green{
  background:#25a85a;
}

.red{
  background:#c33a45;
}

.gray{
  background:#384252;
}

.partyBox{
  margin-top:16px;
  padding:12px;
  border:2px solid #3b4656;
  border-radius:9px;
  background:#111720;
}

.partyTitle{
  font-weight:bold;
  margin-bottom:8px;
}

.partyPlayers{
  font-size:13px;
  line-height:1.7;
  color:#d4dbe5;
}

.ready{
  color:#5ee78b;
}

.notReady{
  color:#ffb84d;
}

#lobbyStatus{
  margin-top:12px;
  text-align:center;
  color:#aeb8c8;
  min-height:18px;
  font-size:13px;
}

/* =========================
   COUNTDOWN / END
========================= */

#countdownOverlay,
#endOverlay{
  position:fixed;
  inset:0;
  z-index:90;
  background:rgba(0,0,0,.55);
  display:flex;
  align-items:center;
  justify-content:center;
  flex-direction:column;
  text-align:center;
}

#countdownText{
  font-size:100px;
  font-weight:900;
  color:#ffd84d;
  text-shadow:6px 6px #111;
}

#endTitle{
  font-size:48px;
  font-weight:900;
  color:#ffd84d;
  text-shadow:4px 4px #111;
}

#endSubtitle{
  margin:10px 0 20px;
  color:#d8dee8;
}

/* =========================
   MOBILE CONTROLS
========================= */

#mobileControls{
  display:none;
  position:fixed;
  inset:0;
  z-index:60;
  pointer-events:none;
}

.joystick{
  position:absolute;
  width:120px;
  height:120px;
  border-radius:50%;
  background:rgba(255,255,255,.08);
  border:2px solid rgba(255,255,255,.18);
  pointer-events:auto;
}

#moveJoystick{
  left:25px;
  bottom:25px;
}

#aimJoystick{
  right:25px;
  bottom:25px;
}

.stick{
  position:absolute;
  width:50px;
  height:50px;
  left:35px;
  top:35px;
  border-radius:50%;
  background:rgba(255,255,255,.2);
  border:2px solid rgba(255,255,255,.25);
}

.mobileButton{
  position:absolute;
  pointer-events:auto;
  border:2px solid rgba(255,255,255,.25);
  background:rgba(15,20,28,.82);
  color:white;
  border-radius:50%;
  display:flex;
  align-items:center;
  justify-content:center;
  font-weight:bold;
  font-size:13px;
}

#fireButton{
  right:165px;
  bottom:55px;
  width:70px;
  height:70px;
  background:rgba(200,50,50,.65);
}

#reloadButton{
  right:150px;
  bottom:145px;
  width:54px;
  height:54px;
}

#buildButton{
  right:215px;
  bottom:135px;
  width:54px;
  height:54px;
}

#pickaxeButton{
  right:280px;
  bottom:115px;
  width:54px;
  height:54px;
}

#pickupButton{
  right:220px;
  bottom:210px;
  width:54px;
  height:54px;
}

@media(max-width:800px){
  #playerList{
    display:none;
  }

  #mobileControls{
    display:block;
  }

  #hotbar{
    bottom:155px;
    transform:translateX(-50%) scale(.8);
    transform-origin:center bottom;
  }

  #ammo{
    right:12px;
    bottom:155px;
  }

  #actionButton,
  #emotes,
  #chatInputBox{
    display:none;
  }

  #chat{
    bottom:285px;
    left:10px;
    width:220px;
  }

  #hud{
    transform:scale(.85);
    transform-origin:top left;
  }
}
</style>
</head>

<body>

<div id="game">
  <canvas id="canvas" width="1100" height="700"></canvas>
</div>

<div id="connection">Desconectado</div>

<div id="hud">
  <div id="playerCard">
    <div id="playerName">Jugador</div>

    <div style="font-size:10px;color:#9fa9b8;">VIDA</div>
    <div class="bar">
      <div id="hpBar"></div>
    </div>

    <div style="font-size:10px;color:#9fa9b8;margin-top:4px;">ESCUDO</div>
    <div class="bar">
      <div id="shieldBar"></div>
    </div>

    <div id="stats">
      Kills: <span id="kills">0</span>
      &nbsp; | &nbsp;
      Ping: <span id="ping">--</span>
    </div>
  </div>
</div>

<div id="topCenter">
  <div id="aliveCount">Esperando partida...</div>
</div>

<div id="playerList">
  <div id="playerListTitle">JUGADORES</div>
  <div id="players"></div>
</div>

<div id="chat"></div>

<div id="chatInputBox">
  <input id="chatInput" maxlength="100" placeholder="Escribe un mensaje...">
  <button id="chatSend">Enviar</button>
</div>

<div id="hotbar">

  <div class="slot active" data-slot="1">
    <span class="slotKey">1</span>
    <span class="slotIcon">🔫</span>
    <span class="slotName">Rifle</span>
  </div>

  <div class="slot" data-slot="2">
    <span class="slotKey">2</span>
    <span class="slotIcon">💥</span>
    <span class="slotName">Escopeta</span>
  </div>

  <div class="slot" data-slot="3">
    <span class="slotKey">3</span>
    <span class="slotIcon">🧱</span>
    <span class="slotName">Build</span>
  </div>

  <div class="slot" data-slot="4">
    <span class="slotKey">4</span>
    <span class="slotIcon">⛏️</span>
    <span class="slotName">Pickaxe</span>
  </div>

</div>

<div id="ammo">
  Munición: <span id="ammoCount">--</span>
</div>

<button id="actionButton">Recoger</button>

<div id="emotes">
  <button class="emote" data-emote="😀">😀</button>
  <button class="emote" data-emote="😂">😂</button>
  <button class="emote" data-emote="😎">😎</button>
</div>

<div id="mobileControls">

  <div class="joystick" id="moveJoystick">
    <div class="stick" id="moveStick"></div>
  </div>

  <div class="joystick" id="aimJoystick">
    <div class="stick" id="aimStick"></div>
  </div>

  <button class="mobileButton" id="fireButton">FIRE</button>
  <button class="mobileButton" id="reloadButton">R</button>
  <button class="mobileButton" id="buildButton">BUILD</button>
  <button class="mobileButton" id="pickaxeButton">⛏</button>
  <button class="mobileButton" id="pickupButton">E</button>

</div>

<div id="lobby">

  <div id="lobbyPanel">

    <div id="logo">PIXEL ROYALE</div>
    <div id="subtitle">Battle Royale 2D</div>

    <input
      id="nameInput"
      class="input"
      maxlength="16"
      placeholder="Tu nombre"
      value="Player"
    >

    <select id="teamMode" class="select">
      <option value="solo">Solo</option>
      <option value="duo">Dúos</option>
      <option value="squad">Squads</option>
    </select>

    <button id="createParty" class="button primary">
      Crear partida
    </button>

    <button id="joinParty" class="button gray">
      Unirse con código
    </button>

    <div id="joinBox" class="hidden">

      <input
        id="partyCodeInput"
        class="input"
        maxlength="8"
        placeholder="Código de partida"
      >

      <button id="confirmJoin" class="button green">
        Unirse
      </button>

    </div>

    <div id="partyPanel" class="partyBox hidden">

      <div class="partyTitle">
        Sala: <span id="partyCode">----</span>
      </div>

      <div class="partyPlayers" id="partyPlayers">
        Esperando jugadores...
      </div>

      <button id="readyButton" class="button green">
        LISTO
      </button>

      <button id="startButton" class="button primary hidden">
        INICIAR PARTIDA
      </button>

      <button id="leaveButton" class="button red">
        SALIR
      </button>

    </div>

    <div id="lobbyStatus"></div>

  </div>
</div>

<div id="countdownOverlay" class="hidden">
  <div id="countdownText">3</div>
</div>

<div id="endOverlay" class="hidden">
  <div id="endTitle">VICTORIA</div>
  <div id="endSubtitle">Has ganado la partida</div>

  <button id="playAgain" class="button primary" style="width:220px;">
    JUGAR OTRA VEZ
  </button>
</div>

<script>
"use strict";

/* =========================================================
   CONFIG
========================================================= */

const canvas =
  document.getElementById("canvas");

const ctx =
  canvas.getContext("2d");

const W = 1100;
const H = 700;
const WORLD = 2400;

const PLAYER_SPEED = 225;
const POSITION_SEND_RATE = 40;

const EMOTE_DURATION = 2000;
const PICKAXE_DURATION = 350;

/* =========================================================
   WEBSOCKET
========================================================= */

let socket = null;
let connected = false;

function getServerURL(){

  const protocol =
    location.protocol === "https:"
      ? "wss://"
      : "ws://";

  return protocol + location.host;
}

function connect(){

  try{
    socket =
      new WebSocket(
        getServerURL()
      );
  }catch(e){

    setConnection(false);
    return;
  }

  socket.onopen = () => {

    connected = true;

    setConnection(true);

    const savedName =
      localStorage.getItem(
        "pixelRoyaleName"
      );

    if(savedName){

      document
        .getElementById("nameInput")
        .value = savedName;
    }
  };

  socket.onclose = () => {

    connected = false;

    setConnection(false);

    setTimeout(() => {

      if(!connected){
        connect();
      }

    },2000);
  };

  socket.onerror = () => {
    setConnection(false);
  };

  socket.onmessage = event => {

    let msg;

    try{
      msg =
        JSON.parse(
          event.data
        );
    }catch(e){
      return;
    }

    handleMessage(msg);
  };
}

function send(data){

  if(
    socket &&
    socket.readyState ===
      WebSocket.OPEN
  ){

    socket.send(
      JSON.stringify(data)
    );
  }
}

function setConnection(ok){

  const el =
    document.getElementById(
      "connection"
    );

  el.classList.toggle(
    "ok",
    ok
  );

  el.textContent =
    ok
      ? "Conectado"
      : "Desconectado";

  el.style.display =
    ok
      ? "none"
      : "block";
}

/* =========================================================
   PLAYER STATE
========================================================= */

let me = null;

let players = [];

let bullets = [];
let loot = [];
let walls = [];

let gameStarted = false;
let gameEnded = false;

let serverPosition = {
  x:0,
  y:0
};

let movementInitialized = false;

let lastPositionSend = 0;
let lastFrameTime =
  performance.now();

let playerAnimationTime = 0;

let selectedSlot = 1;

let kills = 0;
let ping = 0;

let lastPickaxeSwing = 0;

/* =========================================================
   MESSAGE HANDLER
========================================================= */

function handleMessage(msg){

  switch(msg.type){

    case "joined":

      me = {
        ...msg.player,

        emote:null,
        selectedSlot:1,
        pickaxeUntil:0
      };

      serverPosition.x =
        me.x;

      serverPosition.y =
        me.y;

      movementInitialized =
        true;

      if(msg.partyCode){
        updatePartyCode(
          msg.partyCode
        );
      }

      showLobbyParty();

      break;

    case "party":

      if(msg.code){
        updatePartyCode(
          msg.code
        );
      }

      if(msg.players){
        updatePartyPlayers(
          msg.players
        );
      }

      if(msg.hostId){
        updateHostControls(
          msg.hostId
        );
      }

      break;

    case "lobby":

      if(msg.players){
        updatePartyPlayers(
          msg.players
        );
      }

      if(msg.code){
        updatePartyCode(
          msg.code
        );
      }

      break;

    case "countdown":

      showCountdown(
        msg.value
      );

      break;

    case "start":

      startMatch(msg);

      break;

    case "state":

      handleState(msg);

      break;

    /*
     * EMOTE REAL
     */
    case "emote":{

      const target =
        players.find(
          p => p.id === msg.id
        );

      if(
        me &&
        msg.id === me.id
      ){

        me.emote =
          msg.emote;

        me.emoteUntil =
          Date.now() +
          EMOTE_DURATION;

      }else if(target){

        target.emote =
          msg.emote;

        target.emoteUntil =
          Date.now() +
          EMOTE_DURATION;
      }

      break;
    }

    case "chat":

      addChatMessage(
        msg.name ||
          "Jugador",
        msg.message ||
          ""
      );

      break;

    case "kill":

      if(
        me &&
        msg.killerId ===
          me.id
      ){

        kills++;
      }

      break;

    case "end":

      endGame(
        msg.winnerName ||
          "Ganador"
      );

      break;

    case "pong":

      if(msg.clientTime){

        ping =
          Date.now() -
          msg.clientTime;
      }

      break;

    case "error":

      setLobbyStatus(
        msg.message ||
          "Ha ocurrido un error."
      );

      break;
  }
}

/* =========================================================
   STATE
========================================================= */

function handleState(msg){

  if(
    Array.isArray(
      msg.players
    )
  ){

    players =
      msg.players;

    if(me){

      const serverMe =
        players.find(
          p =>
            p.id === me.id
        );

      if(serverMe){

        serverPosition.x =
          serverMe.x;

        serverPosition.y =
          serverMe.y;

        me.hp =
          serverMe.hp ??
          me.hp;

        me.shield =
          serverMe.shield ??
          me.shield;

        me.ammo =
          serverMe.ammo ??
          me.ammo;

        me.weapon =
          serverMe.weapon ??
          me.weapon;

        me.angle =
          serverMe.angle ??
          me.angle;

        me.alive =
          serverMe.alive ??
          me.alive;

        /*
         * El servidor puede sincronizar
         * el slot actual.
         */
        if(
          serverMe.selectedSlot
        ){

          me.selectedSlot =
            serverMe.selectedSlot;

          selectedSlot =
            serverMe.selectedSlot;

          document
            .querySelectorAll(".slot")
            .forEach(el => {

              el.classList.toggle(
                "active",
                Number(
                  el.dataset.slot
                ) === selectedSlot
              );
            });
        }

        if(
          serverMe.emote
        ){

          me.emote =
            serverMe.emote;

          me.emoteUntil =
            Date.now() +
            EMOTE_DURATION;
        }

        const error =
          Math.hypot(
            serverPosition.x -
              me.x,
            serverPosition.y -
              me.y
          );

        if(error > 200){

          me.x =
            serverPosition.x;

          me.y =
            serverPosition.y;
        }
      }
    }
  }

  if(
    Array.isArray(
      msg.bullets
    )
  ){

    bullets =
      msg.bullets;
  }

  if(
    Array.isArray(
      msg.loot
    )
  ){

    loot =
      msg.loot;
  }

  if(
    Array.isArray(
      msg.walls
    )
  ){

    walls =
      msg.walls;
  }

  updateHUD();
}

function escapeHTML(text){

  return String(text)
    .replaceAll(
      "&",
      "&amp;"
    )
    .replaceAll(
      "<",
      "&lt;"
    )
    .replaceAll(
      ">",
      "&gt;"
    )
    .replaceAll(
      '"',
      "&quot;"
    )
    .replaceAll(
      "'",
      "&#039;"
    );
}

  message
){

  const chat =
    document.getElementById(

  const div =
    document.createElement(

  div.className =
    "chatMessage";

  div.innerHTML =
    "<b>" +
    escapeHTML(name) +
    ":</b> " +
    escapeHTML(message);

  chat.appendChild(div);

  while(
    chat.children.length > 6

    chat.removeChild(

  setTimeout(() => {

    if(div.parentNode){
      div.remove();
    }

  },10000);
}

   MOVEMENT
========================================================= */

const mobileMove = {
  x:0,
  y:0
};

const mobileAim = {
  x:0,
  y:0
};

function getMovementDirection(){

  let x = 0;
  let y = 0;

  if(
    keys["w"] ||
    keys["arrowup"]
  ){

    y -= 1;
  }

  if(
    keys["s"] ||
    keys["arrowdown"]
  ){

    y += 1;
  }

  if(
    keys["a"] ||
    keys["arrowleft"]
  ){

    x -= 1;
  }

  if(
    keys["d"] ||
    keys["arrowright"]
  ){

    x += 1;
  }

  x += mobileMove.x;
  y += mobileMove.y;

  const length =
    Math.hypot(
      x,
      y
    );

  if(length > 1){

    x /= length;
    y /= length;
  }

  return {
    x,
    y
  };
}

/* =========================================================
   MOBILE JOYSTICK
========================================================= */

function setupJoystick(
  elementId,
  stickId,
  output
){

  const zone =
    document.getElementById(
      elementId
    );

  const stick =
    document.getElementById(
      stickId
    );

  let active = false;
  let pointerId = null;

  const radius = 35;

  function update(e){

    const rect =
      zone.getBoundingClientRect();

    const centerX =
      rect.left +
      rect.width / 2;

    const centerY =
      rect.top +
      rect.height / 2;

    let dx =
      e.clientX -
      centerX;

    let dy =
      e.clientY -
      centerY;

    const distance =
      Math.hypot(
        dx,
        dy
      );

    if(
      distance > radius
    ){

      dx =
        dx /
        distance *
        radius;

      dy =
        dy /
        distance *
        radius;
    }

    stick.style.transform =
      `translate(${dx}px,${dy}px)`;

    output.x =
      dx / radius;

    output.y =
      dy / radius;
  }

  function reset(){

    active = false;
    pointerId = null;

    output.x = 0;
    output.y = 0;

    stick.style.transform =
      "translate(0px,0px)";
  }

  zone.addEventListener(
    "pointerdown",
    e => {

      active = true;

      pointerId =
        e.pointerId;

      zone.setPointerCapture(
        e.pointerId
      );

      update(e);
    }
  );

  zone.addEventListener(
    "pointermove",
    e => {

      if(
        active &&
        e.pointerId ===
          pointerId
      ){

        update(e);
      }
    }
  );

  zone.addEventListener(
    "pointerup",
    e => {

      if(
        e.pointerId ===
        pointerId
      ){

        reset();
      }
    }
  );

  zone.addEventListener(
    "pointercancel",
    reset
  );
}

  "moveStick",
  mobileMove
);

/* =========================================================
   AIM
========================================================= */

function updateAim(){

  if(!me) return;

  if(
    Math.abs(mobileAim.x) > .15 ||
    Math.abs(mobileAim.y) > .15
  ){

    me.angle =
      Math.atan2(
        mobileAim.y,
        mobileAim.x
      );

    return;
  }

  const dx =
    mouseX -
    W / 2;

  const dy =
    mouseY -
    H / 2;

  me.angle =
    Math.atan2(
      dy,
      dx
    );
}

/* =========================================================
   GAME LOOP
========================================================= */

function loop(now){

  const delta =
    Math.min(
      (
        now -
        lastFrameTime
      ) / 1000,
      0.05
    );

  lastFrameTime =
    now;

  if(
    me &&
    gameStarted &&
    !gameEnded
  ){

    const dir =
      getMovementDirection();

    const moving =
      Math.abs(dir.x) > .01 ||
      Math.abs(dir.y) > .01;

    if(moving){

      me.x +=
        dir.x *
        PLAYER_SPEED *
        delta;

      me.y +=
        dir.y *
        PLAYER_SPEED *
        delta;

      me.x =
        Math.max(
          30,
          Math.min(
            WORLD - 30,
            me.x
          )
        );

      me.y =
        Math.max(
          30,
          Math.min(
            WORLD - 30,
            me.y
          )
        );
    }

    if(
      !moving &&
      movementInitialized &&
      Number.isFinite(
        serverPosition.x
      )
    ){

      const dx =
        serverPosition.x -
        me.x;

      const dy =
        serverPosition.y -
        me.y;

      const error =
        Math.hypot(
          dx,
          dy
        );

      if(error > 120){

        me.x =
          serverPosition.x;

        me.y =
          serverPosition.y;

      }else if(error > 2){

        const correction =
          Math.min(
            1,
            delta * 8
          );

        me.x +=
          dx *
          correction;

        me.y +=
          dy *
          correction;
      }
    }

    updateAim();

    if(
      now -
      lastPositionSend >=
      POSITION_SEND_RATE
    ){

      lastPositionSend =
        now;

      send({
        type:"update",
        x:Math.round(me.x),
        y:Math.round(me.y),
        angle:me.angle
      });
    }

    updatePlayerAnimation(
      moving,
      delta
    );

    /*
     * El pico se usa con F.
     * Con click se dispara solamente
     * si no tenemos el pico equipado.
     */
    if(
      mouseDown &&
      selectedSlot !== 4
    ){

      shoot();
    }
  }

  draw();

  requestAnimationFrame(
    loop
  );
}

   ANIMATION
========================================================= */

function updatePlayerAnimation(
  moving,
  delta
){

  if(moving){

    playerAnimationTime +=
      delta * 9;
  }
}

/* =========================================================
   DRAW
========================================================= */

function draw(){

  ctx.clearRect(
    0,
    0,
    W,
    H
  );

  drawBackground();

  if(!me){

    drawCenterMessage(
      "Conectando..."
    );

    return;
  }

  const cameraX =
    clamp(
      me.x -
        W / 2,
      0,
      WORLD - W
    );

  const cameraY =
    clamp(
      me.y -
        H / 2,
      0,
      WORLD - H
    );

  ctx.save();

  ctx.translate(
    -cameraX,
    -cameraY
  );

  drawWorld();

  drawLoot();

  drawWalls();

  drawBullets();

  players.forEach(p => {

    if(
      !p ||
      p.alive === false
    ){

      return;
    }

    let x = p.x;
    let y = p.y;

    if(
      me &&
      p.id === me.id
    ){

      x = me.x;
      y = me.y;
    }

    drawPlayer(
      {
        ...p,
        x,
        y
      },
      p.id === me.id
    );
  });

  if(
    me &&
    !players.some(
      p =>
        p.id === me.id
    )
  ){

    drawPlayer(
      me,
      true
    );
  }

  ctx.restore();
}

/* =========================================================
   WORLD
========================================================= */

function drawWorld(){

  ctx.fillStyle =
    "#5a913f";

  ctx.fillRect(
    0,
    0,
    WORLD,
    WORLD
  );

  const grid = 80;

  ctx.strokeStyle =
    "rgba(20,50,20,.12)";

  ctx.lineWidth = 2;

  for(
    let x = 0;
    x <= WORLD;
    x += grid
  ){

    ctx.beginPath();

    ctx.moveTo(
      x,
      0
    );

    ctx.lineTo(
      x,
      WORLD
    );

    ctx.stroke();
  }

  for(
    let y = 0;
    y <= WORLD;
    y += grid
  ){

    ctx.beginPath();

    ctx.moveTo(
      0,
      y
    );

    ctx.lineTo(
      WORLD,
      y
    );

    ctx.stroke();
  }

  ctx.fillStyle =
    "rgba(50,110,170,.3)";

  ctx.fillRect(
    450,
    400,
    400,
    250
  );

  ctx.fillStyle =
    "rgba(50,110,170,.3)";

  ctx.fillRect(
    1550,
    1350,
    450,
    300
  );

  ctx.fillStyle =
    "rgba(180,150,70,.25)";

  ctx.fillRect(
    1000,
    700,
    500,
    350
  );
}

function drawLoot(){

  loot.forEach(item => {

    if(!item) return;

    const x =
      item.x;

    const y =
      item.y;

    ctx.save();

    ctx.translate(
      x,
      y
    );

    ctx.fillStyle =
      "#f4c542";

    ctx.fillRect(
      -8,
      -8,
      16,
      16
    );

    ctx.fillStyle =
      "#fff";

    ctx.fillRect(
      -3,
      -12,
      6,
      6
    );

    ctx.restore();
  });
}

/* =========================================================
   WALLS / CONSTRUCTIONS
========================================================= */

function drawWalls(){

  walls.forEach(w => {

    if(!w) return;

    const width =
      Number(w.width) || 60;

    const height =
      Number(w.height) || 60;

    /*
     * Sombra
     */
    ctx.fillStyle =
      "rgba(0,0,0,.25)";

    ctx.fillRect(
      w.x + 4,
      w.y + 5,
      width,
      height
    );

    /*
     * Madera
     */
    ctx.fillStyle =
      "#9b643d";

    ctx.fillRect(
      w.x,
      w.y,
      width,
      height
    );

    /*
     * Borde
     */
    ctx.strokeStyle =
      "#603d28";

    ctx.lineWidth = 4;

    ctx.strokeRect(
      w.x,
      w.y,
      width,
      height
    );

    /*
     * Detalles de madera
     */
    ctx.strokeStyle =
      "rgba(255,210,150,.25)";

    ctx.lineWidth = 2;

    ctx.beginPath();

    ctx.moveTo(
      w.x + 8,
      w.y + 8
    );

    ctx.lineTo(
      w.x + width - 8,
      w.y + height - 8
    );

    ctx.moveTo(
      w.x + width - 8,
      w.y + 8
    );

    ctx.lineTo(
      w.x + 8,
      w.y + height - 8
    );

    ctx.stroke();
  });
}

/* =========================================================
   BULLETS
========================================================= */

function drawBullets(){

  bullets.forEach(b => {

    if(!b) return;

    /*
     * Aura
     */
    ctx.fillStyle =
      "rgba(255,210,40,.18)";

    ctx.beginPath();

    ctx.arc(
      b.x,
      b.y,
      7,
      0,
      Math.PI * 2
    );

    ctx.fill();

    /*
     * Bala
     */
    ctx.fillStyle =
      "#ffe44b";

    ctx.beginPath();

    ctx.arc(
      b.x,
      b.y,
      4,
      0,
      Math.PI * 2
    );

    ctx.fill();
  });
}

/* =========================================================
   PLAYER
========================================================= */

function drawPlayer(
  p,
  isMe
){

  const x = p.x;
  const y = p.y;

  const moving =
    p.moving ||
    (
      isMe &&
      (
        Math.abs(
          mobileMove.x
        ) > .1 ||

        Math.abs(
          mobileMove.y
        ) > .1 ||

        keys["w"] ||
        keys["a"] ||
        keys["s"] ||
        keys["d"]
      )
    );

  const walk =
    moving
      ? Math.sin(
          playerAnimationTime *
          1.8
        ) * 4
      : 0;

  ctx.save();

  ctx.translate(
    Math.round(x),
    Math.round(y)
  );

  /*
   * EMOTE SOBRE LA CABEZA
   */
  drawEmoteBubble(
    p
  );

  /*
   * sombra
   */
  ctx.fillStyle =
    "rgba(0,0,0,.25)";

  ctx.fillRect(
    -14,
    14,
    28,
    7
  );

  /*
   * cuerpo
   */
  ctx.fillStyle =
    isMe
      ? "#2e70d1"
      : "#bd4141";

  ctx.fillRect(
    -11,
    -2,
    22,
    24
  );

  /*
   * chaqueta pixel
   */
  ctx.fillStyle =
    isMe
      ? "#3d8cff"
      : "#dc5555";

  ctx.fillRect(
    -14,
    2,
    5,
    15
  );

  ctx.fillRect(
    9,
    2,
    5,
    15
  );

  /*
   * piernas
   */
  ctx.fillStyle =
    "#26334a";

  ctx.fillRect(
    -9,
    20 + walk,
    7,
    13
  );

  ctx.fillRect(
    2,
    20 - walk,
    7,
    13
  );

  /*
   * botas
   */
  ctx.fillStyle =
    "#151a22";

  ctx.fillRect(
    -11,
    31 + walk,
    10,
    5
  );

  ctx.fillRect(
    2,
    31 - walk,
    10,
    5
  );

  /*
   * cuello
   */
  ctx.fillStyle =
    "#e3a678";

  ctx.fillRect(
    -5,
    -8,
    10,
    8
  );

  /*
   * cabeza
   */
  ctx.fillStyle =
    "#e3a678";

  ctx.fillRect(
    -13,
    -27,
    26,
    20
  );

  /*
   * pelo
   */
  ctx.fillStyle =
    "#3a241a";

  ctx.fillRect(
    -14,
    -31,
    28,
    8
  );

  ctx.fillRect(
    -14,
    -27,
    5,
    7
  );

  ctx.fillRect(
    9,
    -27,
    5,
    7
  );

  /*
   * ojos
   */
  ctx.fillStyle =
    "#161616";

  ctx.fillRect(
    -7,
    -19,
    4,
    4
  );

  ctx.fillRect(
    3,
    -19,
    4,
    4
  );

  /*
   * ARMA / PICO
   */
  const isHoldingPickaxe =
    (
      isMe &&
      selectedSlot === 4
    ) ||
    (
      p.selectedSlot === 4
    );

  if(isHoldingPickaxe){

    drawPickaxe(
      p.angle || 0,
      isMe
        ? me.pickaxeUntil
        : 0
    );

  }else{

    drawWeapon(
      p.angle || 0,
      p.weapon
    );
  }

  /*
   * nombre
   */
  ctx.font =
    "bold 12px Arial";

  ctx.textAlign =
    "center";

  ctx.textBaseline =
    "bottom";

  ctx.fillStyle =
    "rgba(0,0,0,.65)";

  ctx.fillText(
    p.name ||
      "Player",
    1,
    -37
  );

  ctx.fillStyle =
    "#fff";

  ctx.fillText(
    p.name ||
      "Player",
    0,
    -39
  );

  /*
   * vida
   */
  const hp =
    Math.max(
      0,
      Math.min(
        100,
        Number(
          p.hp ??
          100
        )
      )
    );

  ctx.fillStyle =
    "#151515";

  ctx.fillRect(
    -22,
    -50,
    44,
    5
  );

  ctx.fillStyle =
    isMe
      ? "#40dd70"
      : "#ff5252";

  ctx.fillRect(
    -22,
    -50,
    44 *
      hp /
      100,
    5
  );

  ctx.restore();
}

/* =========================================================
   EMOTE BUBBLE
========================================================= */

function drawEmoteBubble(p){

  if(!p.emote){
    return;
  }

  /*
   * Si tenemos timestamp y ya pasó,
   * no mostramos nada.
   */
  if(
    p.emoteUntil &&
    Date.now() >
      p.emoteUntil
  ){

    return;
  }

  const text =
    String(
      p.emote
    );

  ctx.save();

  ctx.font =
    "24px Arial";

  ctx.textAlign =
    "center";

  ctx.textBaseline =
    "middle";

  const width =
    Math.max(
      38,
      ctx.measureText(
        text
      ).width + 20
    );

  const height = 34;

  const bx =
    -width / 2;

  const by =
    -91;

  /*
   * Globo
   */
  ctx.fillStyle =
    "rgba(255,255,255,.96)";

  ctx.beginPath();

  ctx.roundRect(
    bx,
    by,
    width,
    height,
    9
  );

  ctx.fill();

  /*
   * Cola
   */
  ctx.beginPath();

  ctx.moveTo(
    -7,
    by + height
  );

  ctx.lineTo(
    0,
    by + height + 9
  );

  ctx.lineTo(
    7,
    by + height
  );

  ctx.closePath();

  ctx.fill();

  ctx.fillStyle =
    "#111";

  ctx.fillText(
    text,
    0,
    by + height / 2
  );

  ctx.restore();
}

/* =========================================================
   PICKAXE
========================================================= */

function drawPickaxe(
  angle,
  swingUntil
){

  ctx.save();

  ctx.rotate(
    angle
  );

  const now =
    Date.now();

  let swing = 0;

  if(
    swingUntil &&
    now < swingUntil
  ){

    const elapsed =
      PICKAXE_DURATION -
      (
        swingUntil -
        now
      );

    const progress =
      Math.min(
        1,
        Math.max(
          0,
          elapsed /
          PICKAXE_DURATION
        )
      );

    swing =
      Math.sin(
        progress *
        Math.PI
      );
  }

  /*
   * Movimiento del brazo/pico
   */
  ctx.rotate(
    -0.55 +
    swing * 1.9
  );

  /*
   * Mango
   */
  ctx.strokeStyle =
    "#74451f";

  ctx.lineWidth = 5;

  ctx.lineCap =
    "round";

  ctx.beginPath();

  ctx.moveTo(
    7,
    1
  );

  ctx.lineTo(
    34,
    23
  );

  ctx.stroke();

  /*
   * Cabeza
   */
  ctx.strokeStyle =
    "#c9d0d8";

  ctx.lineWidth = 6;

  ctx.beginPath();

  ctx.moveTo(
    28,
    17
  );

  ctx.lineTo(
    42,
    4
  );

  ctx.stroke();

  /*
   * Brillo
   */
  ctx.strokeStyle =
    "#eef3f8";

  ctx.lineWidth = 2;

  ctx.beginPath();

  ctx.moveTo(
    29,
    16
  );

  ctx.lineTo(
    41,
    5
  );

  ctx.stroke();

  ctx.restore();
}

/* =========================================================
   WEAPON
========================================================= */

function drawWeapon(
  angle,
  weapon
){

  ctx.save();

  ctx.rotate(
    angle
  );

  ctx.fillStyle =
    "#222831";

  ctx.fillRect(
    4,
    -4,
    27,
    8
  );

  ctx.fillStyle =
    "#4e5968";

  ctx.fillRect(
    16,
    -6,
    18,
    4
  );

  ctx.fillStyle =
    "#171a1f";

  ctx.fillRect(
    1,
    3,
    9,
    9
  );

  if(
    weapon ===
    "shotgun"
  ){

    ctx.fillStyle =
      "#101318";

    ctx.fillRect(
      26,
      -7,
      10,
      4
    );

    ctx.fillRect(
      26,
      3,
      10,
      4
    );
  }

  ctx.restore();
}

/* =========================================================
   BACKGROUND
========================================================= */

function drawBackground(){

  ctx.fillStyle =
    "#101720";

  ctx.fillRect(
    0,
    0,
    W,
    H
  );
}

function drawCenterMessage(
  text
){

  ctx.fillStyle =
    "#fff";

  ctx.font =
    "bold 24px Arial";

  ctx.textAlign =
    "center";

  ctx.fillText(
    text,
    W / 2,
    H / 2
  );
}

/* =========================================================
   UTIL
========================================================= */

function clamp(
  value,
  min,
  max
){

  return Math.max(
    min,
    Math.min(
      max,
      value
    )
  );
}

/* =========================================================
   END GAME
========================================================= */

function endGame(
  winner
){

  gameEnded = true;

  const overlay =
    document.getElementById(
      "endOverlay"
    );

  const title =
    document.getElementById(
      "endTitle"
    );

  const subtitle =
    document.getElementById(
      "endSubtitle"
    );

  title.textContent =
    (
      me &&
      winner ===
        me.name
    )
      ? "VICTORIA"
      : "DERROTA";

  subtitle.textContent =
    "Ganador: " +
    winner;

  overlay.classList.remove(
    "hidden"
  );
}

document
  .getElementById(
    "playAgain"
  )
  .addEventListener(
    "click",
    () => {

      location.reload();
    }
  );

/* =========================================================
   PING
========================================================= */

setInterval(
  () => {

    if(connected){

      send({
        type:"ping",
        clientTime:
          Date.now()
      });
    }

  },
  2000
);

/* =========================================================
   START
========================================================= */

connect();

requestAnimationFrame(
  loop
);

</script>
