<!DOCTYPE html><html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PixelRoyale</title><style>
*{box-sizing:border-box;margin:0}body{background:#080b12;color:#fff;font-family:Segoe UI,system-ui,sans-serif;display:flex;justify-content:center;align-items:center;min-height:100vh;overflow:hidden}#game-container{position:relative;box-shadow:0 0 45px #000;border-radius:10px;overflow:hidden}canvas{display:block;background:#17213a}#ui{position:absolute;inset:0;pointer-events:none}.panel{background:rgba(5,8,15,.82);border:1px solid #ffffff22;border-radius:10px;box-shadow:0 8px 30px #0008}.hud{position:absolute;top:12px;left:12px;display:flex;flex-direction:column;gap:6px}.hud .panel{padding:8px 12px}.bar{width:190px;height:13px;background:#111;border-radius:4px;overflow:hidden;margin:3px 0}.fill{height:100%;width:100%}.hp{background:linear-gradient(90deg,#e74c3c,#ffb300)}.shield{background:linear-gradient(90deg,#2979ff,#00e5ff)}#player-list{position:absolute;top:12px;right:12px;width:190px;padding:10px;font-size:12px}.title{color:#00c6ff;font-weight:800;margin-bottom:5px}.plist-item{padding:2px}.dead{text-decoration:line-through;color:#777}.me{color:#2ecc71}.team{color:#ffd54f}#top-center{position:absolute;top:12px;left:50%;transform:translateX(-50%);padding:8px 16px;text-align:center}#storm{color:#ff80ab;font-weight:700}#hotbar{position:absolute;bottom:12px;left:50%;transform:translateX(-50%);display:flex;gap:6px;pointer-events:all}.slot{width:68px;height:62px;border:2px solid #ffffff33;border-radius:9px;background:#05070dcc;display:flex;align-items:center;justify-content:center;flex-direction:column;font-size:22px;cursor:pointer}.slot.active{border-color:#00c6ff;box-shadow:0 0 15px #00c6ff66}.slot small{font-size:10px;color:#bbb}.slot b{font-size:11px}.action{position:absolute;bottom:84px;left:50%;transform:translateX(-50%);padding:7px 14px;border-radius:20px;background:#000b;color:#fff}.chat{position:absolute;bottom:80px;left:12px;width:280px;max-height:120px;overflow:hidden;font-size:12px}.chat-input{position:absolute;bottom:50px;left:12px;display:none;pointer-events:all}.chat-input input{width:280px;padding:8px;border-radius:6px;border:1px solid #00c6ff;background:#000d;color:#fff}.emotes{position:absolute;bottom:12px;left:12px;display:flex;gap:5px;pointer-events:all}.emotes button{width:34px;height:34px;background:#000b;border:1px solid #ffffff33;border-radius:7px;color:#fff}.conn{position:absolute;bottom:12px;right:12px;font-size:11px;color:#2ecc71}.overlay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:#0009;pointer-events:all;z-index:30}.card{width:430px;padding:28px;text-align:center}.card h1{font-size:38px}.card p{color:#aaa;margin:8px 0 18px}.card input,.card select{width:100%;padding:11px;margin:5px 0;border-radius:7px;border:1px solid #ffffff22;background:#111827;color:#fff}.btn{width:100%;padding:12px;margin-top:8px;border:0;border-radius:8px;background:linear-gradient(135deg,#00c6ff,#1769ff);color:white;font-weight:800;cursor:pointer}.btn.alt{background:#252d3d}.hidden{display:none}.reward{font-size:17px;line-height:1.7;margin:14px 0}.gold{color:#ffd54f}.loot-label{font-size:10px}.hint{font-size:11px;color:#888;margin-top:12px}
</style></head><body><div id="game-container"><canvas id="game" width="960" height="620"></canvas><div id="ui">
<div class="hud"><div class="panel"><div style="font-size:10px;color:#aaa">VIDA</div><div class="bar"><div id="health-bar" class="fill hp"></div></div><div style="font-size:10px;color:#6ec6ff">ESCUDO</div><div class="bar"><div id="shield-bar" class="fill shield" style="width:0"></div></div></div><div class="panel" id="stats">🪵 30 · 💀 0 · ⭐ 0</div></div>
<div id="top-center" class="panel"><div id="phaseText">SALA DE ESPERA</div><div id="storm">🌪️ Zona segura</div></div><div id="player-list" class="panel"><div class="title">EQUIPO / JUGADORES</div><div id="plist-content"></div></div><div id="chat-box" class="chat"></div><div id="chat-input-container" class="chat-input"><input id="chat-input" maxlength="100" placeholder="Escribe y pulsa Enter..."></div>
<div id="hotbar"><div class="slot active" id="slot1" onclick="setSlot(1)">⛏️<small>1 Pico</small></div><div class="slot" id="slot2" onclick="setSlot(2)">🔫<small>2 Arma</small><b id="ammo">12/12</b></div></div><div id="action" class="action hidden"></div>
<div class="emotes"><button onclick="doEmote('dance')">💃</button><button onclick="doEmote('wave')">👋</button><button onclick="doEmote('cheer')">🎉</button><button onclick="doEmote('sit')">🪑</button></div><div id="connection-status" class="conn">Desconectado</div>
<div id="start-overlay" class="overlay"><div class="card panel"><h1>PIXELROYALE</h1><p>Battle Royale Pixel · loot · construcción · tormenta</p><input id="name-input" maxlength="16" placeholder="Tu nombre"><select id="team-mode"><option value="1">Solo</option><option value="2">Escuadrones de 2</option><option value="3">Escuadrones de 3</option><option value="4">Escuadrones de 4</option></select><button class="btn" onclick="connect()">ENTRAR A LA LOBBY</button><div class="hint">WASD · ratón · Q construir · R recargar · E recoger · 1/2 cambiar</div></div></div>
<div id="count-overlay" class="overlay hidden"><div class="card panel"><h1 id="count-number">10</h1><p>Preparando partida...</p><div id="team-info"></div></div></div>
<div id="end-overlay" class="overlay hidden"><div class="card panel"><h1 id="end-title">VICTORIA</h1><div id="reward" class="reward"></div><button class="btn" onclick="playAgain()">JUGAR OTRA VEZ</button></div></div>
</div></div><script>
const canvas=document.getElementById('game'),ctx=canvas.getContext('2d'),W=canvas.width,H=canvas.height,WORLD=2400;let ws=null,myId=null,me=null,players=new Map(),walls=[],trees=[],loot=[],bullets=[],particles=[];let keys={},mouse={x:W/2,y:H/2,down:false},camX=0,camY=0,lastShot=0,lastUpdate=0,lastSwing=0,gameRunning=false,phase='lobby',buildMode=false,currentSlot=2,myKills=0,myXP=0,teamMode=1,storm={cx:WORLD/2,cy:WORLD/2,radius:1500,target:1500};const weaponInfo={pistol:['Pistola',24,260,12],smg:['Subfusil',14,90,30],shotgun:['Escopeta',11,650,6],rifle:['Rifle',31,170,20],sniper:['Francotirador',90,1000,5]};
function rand(a,b){return Math.random()*(b-a)+a}function dist(a,b){return Math.hypot(a.x-b.x,a.y-b.y)}function send(x){if(ws&&ws.readyState===1)ws.send(JSON.stringify(x))}
function connect(){const name=document.getElementById('name-input').value.trim()||'Jugador';teamMode=+document.getElementById('team-mode').value;const proto=location.protocol==='https:'?'wss:':'ws:';ws=new WebSocket(proto+'//'+location.host);ws.onopen=()=>{document.getElementById('connection-status').textContent='● Conectado';send({type:'setName',name});send({type:'setTeamMode',mode:teamMode});};ws.onclose=()=>{gameRunning=false;document.getElementById('connection-status').textContent='● Desconectado'};ws.onmessage=e=>handle(JSON.parse(e.data));}
function handle(d){switch(d.type){case'welcome':myId=d.id;phase=d.phase;walls=d.walls||[];trees=d.trees||[];loot=d.loot||[];storm=d.storm||storm;players.clear();for(const p of d.players){if(p.id===myId)me={...p};else players.set(p.id,{...p,walkCycle:0})}document.getElementById('start-overlay').classList.add('hidden');gameRunning=true;updateHUD();updateList();requestAnimationFrame(loop);break;
case'playerJoined':if(d.player.id!==myId)players.set(d.player.id,{...d.player,walkCycle:0});updateList();break;case'playerLeft':players.delete(d.id);updateList();break;case'countdown':phase='countdown';document.getElementById('count-overlay').classList.remove('hidden');document.getElementById('count-number').textContent=d.value;document.getElementById('phaseText').textContent='EMPIEZA EN '+d.value;break;
case'matchStart':phase='playing';document.getElementById('count-overlay').classList.add('hidden');players.clear();for(const p of d.players){if(p.id===myId)me={...p};else players.set(p.id,{...p,walkCycle:0})}storm=d.storm;loot=d.loot||loot;updateHUD();updateList();break;
case'playerUpdate':if(d.id!==myId){let p=players.get(d.id);if(!p){p={};players.set(d.id,p)}Object.assign(p,d);p.walkCycle=(p.walkCycle||0)+.2}break;case'nameChange':if(players.has(d.id)){players.get(d.id).name=d.name;updateList()}break;
case'teamChanged':if(d.id===myId)me.team=d.team;else if(players.has(d.id))players.get(d.id).team=d.team;updateList();break;case'teamMode':teamMode=d.mode;break;
case'shoot':if(d.id!==myId){const ang=d.angle;bullets.push({x:d.x,y:d.y,vx:Math.cos(ang)*14,vy:Math.sin(ang)*14,radius:4,life:65,fromId:d.id})}break;case'playerDamaged':if(d.id===myId){me.health=d.health;me.shield=d.shield}else if(players.has(d.id)){players.get(d.id).health=d.health;players.get(d.id).shield=d.shield}updateHUD();break;
case'playerDied':{if(d.id===myId){me.alive=false;me.health=0}else if(players.has(d.id)){players.get(d.id).alive=false;players.get(d.id).health=0;const p=players.get(d.id);createParticles(p.x,p.y,p.color,18)}if(d.killerId===myId){myKills=d.kills||myKills+1}updateHUD();updateList();}break;
case'wallBuilt':walls.push(d.wall);if(d.playerId===myId)me.materials=d.materials;break;case'wallDamaged':{const w=walls.find(x=>x.id===d.wallId);if(w)w.health=d.health}break;case'wallDestroyed':walls=walls.filter(x=>x.id!==d.wallId);break;case'treeDamaged':{const t=trees.find(x=>x.id===d.treeId);if(t)t.health=d.health}break;case'treeDestroyed':trees=trees.filter(x=>x.id!==d.treeId);if(d.playerId===myId)me.materials=d.materials;break;
case'lootPicked':loot=loot.filter(x=>x.id!==d.lootId);if(d.playerId===myId){if(d.item.type==='shield')me.shield=Math.min(100,me.shield+50);if(d.item.type==='medkit')me.health=Math.min(100,me.health+50);if(d.item.type==='ammo')me.ammo=me.maxAmmo;if(d.item.type==='materials')me.materials+=40;if(weaponInfo[d.item.type]){me.weapon=d.item.type;me.maxAmmo=weaponInfo[d.item.type][3];me.ammo=me.maxAmmo}}updateHUD();break;
case'weaponChanged':me.weapon=d.weapon;me.ammo=d.ammo;me.maxAmmo=d.maxAmmo;updateHUD();break;case'reloaded':me.ammo=d.ammo;me.maxAmmo=d.maxAmmo;updateHUD();break;case'stormUpdate':storm=d.storm;break;case'stormTick':storm=d.storm;break;case'chat':addChat(d.name,d.message);break;
case'matchEnd':phase='gameover';gameRunning=false;const r=d.rewards.find(x=>x.id===myId);const win=d.winnerTeam&&me.team===d.winnerTeam;document.getElementById('end-title').textContent=win?'🏆 VICTORIA ROYALE':'💀 DERROTA';document.getElementById('reward').innerHTML=`⭐ +${r?.xp||0} XP<br>🪙 +${r?.coins||0} monedas<br>💀 ${r?.kills||myKills} eliminaciones`;document.getElementById('end-overlay').classList.remove('hidden');break;}}
function updateHUD(){if(!me)return;document.getElementById('health-bar').style.width=Math.max(0,me.health)+'%';document.getElementById('shield-bar').style.width=Math.max(0,me.shield)+'%';document.getElementById('stats').textContent=`🪵 ${me.materials} · 💀 ${myKills} · ⭐ ${me.xp||myXP}`;document.getElementById('ammo').textContent=`${me.ammo||0}/${me.maxAmmo||0}`;document.getElementById('action').classList.toggle('hidden',!buildMode)}
function updateList(){let h='';if(me)h+=`<div class="plist-item me">🟢 ${me.name} <span class="team">T${me.team||1}</span></div>`;for(const p of players.values())h+=`<div class="plist-item ${p.alive?'':'dead'}">${p.alive?'🟢':'☠️'} ${p.name} <span class="team">T${p.team||1}</span></div>`;document.getElementById('plist-content').innerHTML=h}
function addChat(n,m){const b=document.getElementById('chat-box');b.innerHTML+=`<div class="panel" style="padding:3px 7px;margin:2px"> <b>${n}:</b> ${m}</div>`;while(b.children.length>8)b.firstChild.remove()}
function setSlot(n){currentSlot=n;document.getElementById('slot1').classList.toggle('active',n===1);document.getElementById('slot2').classList.toggle('active',n===2);buildMode=false;updateHUD()}
function doEmote(t){if(!me?.alive)return;me.emote=t;send({type:'update',x:me.x,y:me.y,angle:me.angle,emote:t,slot:currentSlot});setTimeout(()=>{if(me)me.emote=null},t==='sit'?99999:1800)}
function build(){if(!me?.alive||me.materials<10)return;const x=me.x+Math.cos(me.angle)*65-20,y=me.y+Math.sin(me.angle)*65-20;const kinds=['wall','ramp','floor','roof'];const kind=kinds[Math.floor((performance.now()/1000))%4];send({type:'build',x,y,kind})}
function pickup(){if(!me?.alive)return;let near=loot.filter(x=>dist(me,x)<75).sort((a,b)=>dist(me,a)-dist(me,b))[0];if(near)send({type:'pickup',lootId:near.id})}
function swing(){if(!me?.alive||currentSlot!==1||Date.now()-lastSwing<350)return;lastSwing=Date.now();let t=trees.sort((a,b)=>dist(me,a)-dist(me,b))[0];if(t&&dist(me,t)<55)send({type:'treeHit',treeId:t.id});}
function shoot(){if(!me?.alive||currentSlot!==2||buildMode)return;const w=weaponInfo[me.weapon]||weaponInfo.pistol;if(Date.now()-lastShot<w[2])return;if((me.ammo||0)<=0)return;lastShot=Date.now();send({type:'shoot'});const a=me.angle;bullets.push({x:me.x+Math.cos(a)*20,y:me.y+Math.sin(a)*20,vx:Math.cos(a)*14,vy:Math.sin(a)*14,radius:4,life:65,fromId:myId})}
function loop(){if(!gameRunning||!me)return;if(me.alive&&phase==='playing'){let dx=(keys.d?1:0)-(keys.a?1:0),dy=(keys.s?1:0)-(keys.w?1:0);if(dx||dy){let l=Math.hypot(dx,dy);me.x+=dx/l*3.6;me.y+=dy/l*3.6;me.walkCycle=(me.walkCycle||0)+.25}me.x=Math.max(20,Math.min(WORLD-20,me.x));me.y=Math.max(20,Math.min(WORLD-20,me.y));me.angle=Math.atan2(mouse.y+camY-me.y,mouse.x+camX-me.x);if(mouse.down)shoot();if(Date.now()-lastUpdate>60){lastUpdate=Date.now();send({type:'update',x:me.x,y:me.y,angle:me.angle,emote:me.emote,slot:currentSlot})}}
for(let i=bullets.length-1;i>=0;i--){const b=bullets[i];b.x+=b.vx;b.y+=b.vy;b.life--;if(b.fromId===myId){for(const p of players.values())if(p.alive&&p.team!==me.team&&dist(b,p)<20){send({type:'hit',targetId:p.id,damage:(weaponInfo[me.weapon]||weaponInfo.pistol)[1]});b.life=0;break}}if(b.life<=0)bullets.splice(i,1)}for(let i=particles.length-1;i>=0;i--){const p=particles[i];p.x+=p.vx;p.y+=p.vy;p.vx*=.94;p.vy*=.94;p.life--;if(p.life<=0)particles.splice(i,1)}camX=Math.max(0,Math.min(WORLD-W,me.x-W/2));camY=Math.max(0,Math.min(WORLD-H,me.y-H/2));draw();requestAnimationFrame(loop)}
function drawPerson(x,y,a,c,w,e,n,isMe,slot){ctx.save();ctx.translate(x,y);const bob=e==='cheer'?2:0;ctx.fillStyle='#0005';ctx.beginPath();ctx.ellipse(0,13,10,4,0,0,7);ctx.fill();ctx.fillStyle=c;ctx.fillRect(-8,-13+bob,16,17);ctx.fillStyle='#f5d0a9';ctx.beginPath();ctx.arc(0,-19+bob,7,0,7);ctx.fill();ctx.fillStyle='#222';ctx.fillRect(-5,-25+bob,10,3);ctx.strokeStyle=c;ctx.lineWidth=4;ctx.beginPath();ctx.moveTo(-5,-5);ctx.lineTo(-10,8);ctx.moveTo(5,-5);ctx.lineTo(10,8);ctx.stroke();if(slot===2){ctx.save();ctx.translate(5,-5);ctx.rotate(a);ctx.fillStyle='#333';ctx.fillRect(0,-2,19,4);ctx.restore()}ctx.font='bold 11px sans-serif';ctx.textAlign='center';ctx.fillStyle=isMe?'#2ecc71':'#fff';ctx.fillText(n||'',0,-33);ctx.restore()}
function drawTree(t){ctx.save();ctx.translate(t.x,t.y);ctx.fillStyle='#5d4037';ctx.fillRect(-5,-3,10,20);ctx.fillStyle='#2e8b57';ctx.beginPath();ctx.arc(0,-15,18*(.5+t.health/t.maxHealth/2),0,7);ctx.fill();ctx.restore()}
function drawLoot(l){const icons={pistol:'🔫',smg:'🔫',shotgun:'💥',rifle:'🎯',sniper:'🔭',shield:'🛡️',medkit:'❤️',ammo:'🔸',materials:'🪵'};ctx.save();ctx.translate(l.x,l.y);ctx.fillStyle='#0009';ctx.beginPath();ctx.arc(0,0,15,0,7);ctx.fill();ctx.font='20px serif';ctx.textAlign='center';ctx.fillText(icons[l.type]||'📦',0,7);ctx.font='9px sans-serif';ctx.fillStyle='#fff';ctx.fillText(l.type,0,27);ctx.restore()}
function draw(){ctx.clearRect(0,0,W,H);ctx.save();ctx.translate(-camX,-camY);ctx.fillStyle='#17213a';ctx.fillRect(0,0,WORLD,WORLD);ctx.strokeStyle='#ffffff08';for(let x=0;x<WORLD;x+=60){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,WORLD);ctx.stroke()}for(let y=0;y<WORLD;y+=60){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(WORLD,y);ctx.stroke()}for(const t of trees)drawTree(t);for(const l of loot)drawLoot(l);for(const w of walls){ctx.save();ctx.fillStyle=w.kind==='ramp'?'#8b6f47':'#69758d';ctx.globalAlpha=Math.max(.35,w.health/(w.kind==='wall'?160:120));ctx.fillRect(w.x,w.y,w.w,w.h);ctx.strokeStyle='#cbd5e1';ctx.strokeRect(w.x,w.y,w.w,w.h);ctx.restore()}for(const b of bullets){ctx.fillStyle=b.fromId===myId?'#00e5ff':'#ff5252';ctx.beginPath();ctx.arc(b.x,b.y,4,0,7);ctx.fill()}for(const p of players.values())if(p.alive)drawPerson(p.x,p.y,p.angle,p.color,p.walkCycle,p.emote,p.name,false,p.slot);if(me.alive)drawPerson(me.x,me.y,me.angle,me.color,me.walkCycle,me.emote,me.name,true,currentSlot);if(buildMode&&me.alive){const bx=me.x+Math.cos(me.angle)*65-20,by=me.y+Math.sin(me.angle)*65-20;ctx.fillStyle='#00c6ff55';ctx.fillRect(bx,by,40,40);ctx.strokeStyle='#00c6ff';ctx.strokeRect(bx,by,40,40)}if(phase==='playing'){ctx.fillStyle='#a0003c44';ctx.beginPath();ctx.rect(0,0,WORLD,WORLD);ctx.arc(storm.cx,storm.cy,storm.radius,0,7,true);ctx.fill('evenodd');ctx.strokeStyle='#ff4f9a';ctx.lineWidth=7;ctx.beginPath();ctx.arc(storm.cx,storm.cy,storm.radius,0,7);ctx.stroke()}ctx.restore();document.getElementById('storm').textContent=phase==='playing'?`🌪️ Zona: ${Math.round(storm.radius)}m`:'🌪️ Esperando partida'}
function playAgain(){document.getElementById('end-overlay').classList.add('hidden');location.reload()}
window.addEventListener('keydown',e=>{keys[e.key.toLowerCase()]=true;if(e.key==='1')setSlot(1);if(e.key==='2')setSlot(2);if(e.key.toLowerCase()==='q'){buildMode=!buildMode;updateHUD()}if(e.code==='Space'&&buildMode){e.preventDefault();build()}if(e.key.toLowerCase()==='e')pickup();if(e.key.toLowerCase()==='r')send({type:'reload'});if(e.key==='Enter'){const c=document.getElementById('chat-input-container'),i=document.getElementById('chat-input');if(c.style.display==='block'){if(i.value.trim())send({type:'chat',message:i.value.trim()});i.value='';c.style.display='none'}else{c.style.display='block';i.focus()}}if(e.key==='3')doEmote('dance');if(e.key==='4')doEmote('wave');if(e.key==='5')doEmote('cheer');if(e.key==='6')doEmote('sit')});window.addEventListener('keyup',e=>keys[e.key.toLowerCase()]=false);canvas.addEventListener('mousemove',e=>{const r=canvas.getBoundingClientRect();mouse.x=e.clientX-r.left;mouse.y=e.clientY-r.top});canvas.addEventListener('mousedown',e=>{if(e.button!==0)return;if(buildMode)build();else mouse.down=true});canvas.addEventListener('mouseup',()=>mouse.down=false);canvas.addEventListener('contextmenu',e=>e.preventDefault());
</script></body></html>
